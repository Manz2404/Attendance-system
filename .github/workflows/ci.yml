name: Verify attendance system
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run test:http
  mysql:
    name: mysql-8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: hadir_test_integration
          MYSQL_USER: attendance_test
          MYSQL_PASSWORD: ci-only-test-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: attendance_test
      DB_PASSWORD: ci-only-test-password
      DB_NAME: hadir_test_integration
      DB_SSL: 'false'
      COOKIE_SECURE: 'false'
      EXPECT_DB_VERSION: '8.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:mysql
  mysql55:
    name: mysql-5.5.42
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: attendance_test
      DB_PASSWORD: ci-only-test-password
      DB_NAME: hadir_test_integration
      DB_SSL: 'false'
      COOKIE_SECURE: 'false'
      EXPECT_DB_VERSION: '5.5.42'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the original MySQL 5.5.42 image in a current container format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          skopeo copy --format v2s2 docker://docker.io/library/mysql:5.5.42 docker-archive:/tmp/hadir-mysql55.tar:hadir-mysql55:5.5.42
          docker load --input /tmp/hadir-mysql55.tar
      - name: Start disposable MySQL 5.5.42
        run: |
          docker run --detach --name hadir-mysql55 --publish 127.0.0.1:3306:3306 \
            --env MYSQL_ROOT_PASSWORD=ci-only-root-password \
            --env MYSQL_DATABASE=hadir_test_integration \
            --env MYSQL_USER=attendance_test \
            --env MYSQL_PASSWORD=ci-only-test-password \
            hadir-mysql55:5.5.42
          for attempt in {1..60}; do
            if docker exec hadir-mysql55 mysql --user=attendance_test --password=ci-only-test-password --database=hadir_test_integration --execute='SELECT VERSION();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs hadir-mysql55
          exit 1
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:mysql
      - name: Stop disposable database
        if: always()
        run: docker rm --force hadir-mysql55 || true
